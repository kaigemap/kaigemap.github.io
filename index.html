<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; require-trusted-types-for 'script'; trusted-types 'none'">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>kaigelab</title>
    <meta name="description" content="Small browser tools by kaigemap, shown running on a PC and a phone.">
    <meta property="og:title" content="kaigelab">
    <meta property="og:description" content="Small browser tools by kaigemap">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://kaigemap.github.io/">
    <meta property="og:image" content="https://kaigemap.github.io/media/hakogazou.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="theme-color" content="#F3F0E8" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#161513" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="alternate" hreflang="ja" href="https://kaigemap.github.io/?lang=ja">
    <link rel="alternate" hreflang="en" href="https://kaigemap.github.io/?lang=en">
    <link rel="alternate" hreflang="es" href="https://kaigemap.github.io/?lang=es">
    <link rel="alternate" hreflang="ko" href="https://kaigemap.github.io/?lang=ko">
    <link rel="alternate" hreflang="x-default" href="https://kaigemap.github.io/">
    <link rel="preload" href="fonts/YoungSerif-Regular.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="stylesheet" href="css/site.css">
    <script type="module" src="js/main.js"></script>
  </head>
  <body data-view="dial">
    <header class="bar">
      <a class="brand" href="./">kaigelab</a>
      <div class="tools">
        <div class="lang">
          <button type="button" class="icon-btn" id="lang-btn" aria-haspopup="menu" aria-expanded="false" data-tip-align="end">
            <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.2"/><path d="M2.8 10h14.4M10 2.8c2 2.1 3 4.5 3 7.2s-1 5.1-3 7.2M10 2.8c-2 2.1-3 4.5-3 7.2s1 5.1 3 7.2"/></svg>
          </button>
          <div class="lang-menu" id="lang-menu" role="menu" hidden></div>
        </div>
        <button type="button" class="icon-btn" id="view-btn" data-tip-align="end">
          <svg class="i-wall" viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="5.5" height="5.5" rx="1.2"/><rect x="11.5" y="3" width="5.5" height="5.5" rx="1.2"/><rect x="3" y="11.5" width="5.5" height="5.5" rx="1.2"/><rect x="11.5" y="11.5" width="5.5" height="5.5" rx="1.2"/></svg>
          <svg class="i-dial" viewBox="0 0 20 20" aria-hidden="true"><path d="M2.5 2.5A17 17 0 0 1 2.5 17.5"/><rect x="5.6" y="2.6" width="3.6" height="3.6" rx=".9" transform="rotate(-18 7.4 4.4)"/><rect x="7" y="7.6" width="4.8" height="4.8" rx="1.1"/><rect x="5.6" y="13.8" width="3.6" height="3.6" rx=".9" transform="rotate(18 7.4 15.6)"/><path d="M15.5 10h2"/></svg>
        </button>
      </div>
    </header>

    <main>
      <h1 class="sr-only">kaigelab</h1>

      <section class="stage" id="stage" aria-roledescription="carousel">
        <div class="dial" id="dial">
          <div class="wheel" aria-hidden="true"></div>
          <div class="slots" id="slots" role="group"></div>
          <div class="fade fade-a" aria-hidden="true"></div>
          <div class="fade fade-b" aria-hidden="true"></div>
          <div class="loupe" aria-hidden="true"></div>
        </div>
        <div class="pairs" id="pairs"></div>
        <div class="caption" id="caption" aria-live="polite">
          <p class="desc"><span id="desc"></span><a class="icon-btn open" id="open" href="#" data-tip-pos="top"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8.5 4.5H5.2A1.7 1.7 0 0 0 3.5 6.2v8.6c0 .9.8 1.7 1.7 1.7h8.6c.9 0 1.7-.8 1.7-1.7v-3.3M11.5 3.5h5v5M16.2 3.8 9.5 10.5"/></svg></a></p>
          <p class="why" id="why"></p>
        </div>
      </section>
      <div class="scroller" id="scroller" aria-hidden="true"></div>

      <section class="wall" id="wall" hidden></section>
    </main>

    <template id="t-pc">
      <div class="pc">
        <div class="pc-bar">
          <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="url"><span class="url-text"></span></span>
        </div>
        <div class="screen pc-screen"><img class="poster" alt="" decoding="async"></div>
      </div>
    </template>
    <template id="t-phone">
      <div class="phone"><div class="bezel"><div class="screen phone-screen"><img class="poster" alt="" decoding="async"></div></div></div>
    </template>
    <template id="t-title">
      <div class="title">
        <p class="meta"><span class="year"></span></p>
        <h2 class="name"></h2>
      </div>
    </template>
    <template id="t-tile">
      <div class="slot">
        <div class="tile-pos">
          <button type="button" class="tile">
            <span class="tile-in">
              <span class="tile-face"></span>
              <span class="tile-lift" aria-hidden="true"></span>
              <span class="tile-light" aria-hidden="true"></span>
            </span>
          </button>
        </div>
      </div>
    </template>

    <noscript>
      <ul class="noscript">
        <li><a href="https://kaigemap.github.io/hakogazou/">hakogazou</a></li>
        <li><a href="https://kaigemap.github.io/zatsucard/">zatsucard</a></li>
        <li><a href="https://kaigemap.github.io/discord-streamkit-layer/">DiscordPyoko</a></li>
        <li><a href="https://kaigemap.github.io/udocards/">udocards</a></li>
        <li><a href="https://kaigemap.github.io/GameMarket-Blog-HTML-Utility/">Auto Max Width</a></li>
        <li><a href="https://kaigemap.github.io/BrowserSenkou/">BrowserSenkou</a></li>
        <li><a href="https://sticker-sheet-simulator.pages.dev/">Sticker Sheet Simulator</a></li>
        <li><a href="https://fuchimoji.pages.dev/">fuchimoji</a></li>
        <li><a href="https://sticker-split.pages.dev/">Sticker Split</a></li>
        <li><a href="https://ocbox.pages.dev/">OCBOX</a></li>
        <li><a href="https://github.com/kaigemap/claude-skill-decision-board">decision-board</a></li>
        <li><a href="https://github.com/kaigemap/claude-skill-speak-notify">speak-notify</a></li>
      </ul>
    </noscript>
  </body>
</html>
